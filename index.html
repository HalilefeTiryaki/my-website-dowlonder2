<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync - Real-Time File Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        .dropzone {
            border: 2px dashed #3b82f6;
            transition: all 0.3s ease;
        }
        .dropzone.active {
            border-color: #2563eb;
            background-color: rgba(59, 130, 246, 0.05);
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .progress-bar {
            height: 4px;
            background-color: #bfdbfe;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }
        .copy-btn {
            transition: all 0.2s ease;
        }
        .copy-btn.copied {
            background-color: #10b981;
            color: white;
        }
        .pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-blue-600 mb-2 flex items-center justify-center">
                <i class="fas fa-cloud-upload-alt mr-3"></i>
                <span>CloudSync</span>
                <span id="connectionStatus" class="ml-3 text-xs font-normal bg-green-100 text-green-800 py-1 px-2 rounded-full flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-1"></span>
                    <span>Connected</span>
                </span>
            </h1>
            <p class="text-gray-600">Real-time file storage synchronized across all devices</p>
        </header>

        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div 
                id="dropzone" 
                class="dropzone rounded-lg p-8 text-center cursor-pointer mb-4"
                ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)"
                ondrop="handleDrop(event)"
            >
                <div class="flex flex-col items-center justify-center space-y-4">
                    <div class="bg-blue-100 p-4 rounded-full">
                        <i class="fas fa-cloud-upload-alt text-blue-500 text-3xl"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-800">Drag & drop files here</h3>
                    <p class="text-gray-500">or</p>
                    <label for="fileInput" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-6 rounded-full cursor-pointer transition duration-300">
                        <i class="fas fa-folder-open mr-2"></i> Upload File
                    </label>
                    <input 
                        id="fileInput" 
                        type="file" 
                        class="hidden" 
                        multiple 
                        onchange="handleFileSelect(event)"
                    />
                </div>
            </div>
            
            <!-- Progress Bar -->
            <div id="progressContainer" class="hidden">
                <div class="flex justify-between mb-1">
                    <span class="text-sm font-medium text-blue-800">Uploading...</span>
                    <span id="progressPercent" class="text-sm font-medium text-blue-800">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- File List Section -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800 flex items-center">
                    <i class="fas fa-file-alt mr-2"></i> Your Files
                    <span id="syncStatus" class="ml-2 text-xs font-normal text-gray-500 hidden">
                        <i class="fas fa-sync-alt animate-spin mr-1"></i> Syncing...
                    </span>
                </h2>
                <div class="flex items-center space-x-2">
                    <div class="relative">
                        <select id="sortSelect" class="appearance-none bg-gray-100 border border-gray-200 text-gray-700 py-2 px-4 pr-8 rounded-full leading-tight focus:outline-none focus:bg-white focus:border-blue-500 text-sm" onchange="sortFiles()">
                            <option value="newest">Newest first</option>
                            <option value="oldest">Oldest first</option>
                            <option value="name-asc">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="size-asc">Size (smallest)</option>
                            <option value="size-desc">Size (largest)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                            <i class="fas fa-sort text-sm"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="fileList" class="space-y-3">
                <!-- Files will appear here -->
                <div id="emptyState" class="text-center py-8">
                    <i class="fas fa-folder-open text-gray-300 text-5xl mb-3"></i>
                    <p class="text-gray-500">No files uploaded yet</p>
                </div>
            </div>
        </div>

        <!-- Language Toggle -->
        <div class="mt-6 text-center">
            <button 
                id="languageToggle" 
                class="text-blue-500 hover:text-blue-700 transition duration-300"
                onclick="toggleLanguage()"
            >
                <i class="fas fa-language mr-1"></i> Türkçe / English
            </button>
        </div>
    </div>

    <script>
        // Firebase Configuration (replace with your actual config)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceWithYours",
            authDomain: "your-project-id.firebaseapp.com",
            databaseURL: "https://your-project-id.firebaseio.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const database = firebase.database();

        // Store uploaded files
        let uploadedFiles = [];
        let currentLanguage = 'en';
        const currentUserId = 'demo-user'; // In a real app, this would be the logged-in user

        // Language translations
        const translations = {
            en: {
                title: "CloudSync",
                subtitle: "Real-time file storage synchronized across all devices",
                dragDrop: "Drag & drop files here",
                or: "or",
                uploadFile: "Upload File",
                yourFiles: "Your Files",
                noFiles: "No files uploaded yet",
                download: "Download",
                delete: "Delete",
                copyLink: "Copy Link",
                copied: "Copied!",
                uploading: "Uploading...",
                changeLanguage: "Türkçe / English",
                sortOptions: {
                    newest: "Newest first",
                    oldest: "Oldest first",
                    nameAsc: "Name (A-Z)",
                    nameDesc: "Name (Z-A)",
                    sizeAsc: "Size (smallest)",
                    sizeDesc: "Size (largest)"
                },
                connection: {
                    connected: "Connected",
                    disconnected: "Disconnected",
                    reconnecting: "Reconnecting..."
                }
            },
            tr: {
                title: "BulutSenk",
                subtitle: "Tüm cihazlarda senkronize gerçek zamanlı dosya depolama",
                dragDrop: "Dosyaları buraya sürükleyin",
                or: "veya",
                uploadFile: "Dosya Yükle",
                yourFiles: "Dosyalarınız",
                noFiles: "Henüz dosya yüklenmedi",
                download: "İndir",
                delete: "Sil",
                copyLink: "Linki Kopyala",
                copied: "Kopyalandı!",
                uploading: "Yükleniyor...",
                changeLanguage: "Türkçe / English",
                sortOptions: {
                    newest: "Yeniden eskiye",
                    oldest: "Eskiden yeniye",
                    nameAsc: "İsme göre (A-Z)",
                    nameDesc: "İsme göre (Z-A)",
                    sizeAsc: "Boyut (küçükten)",
                    sizeDesc: "Boyut (büyükten)"
                },
                connection: {
                    connected: "Bağlı",
                    disconnected: "Bağlantı kesildi",
                    reconnecting: "Yeniden bağlanıyor..."
                }
            }
        };

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            // Load files from Firebase when page loads
            fetchFilesFromFirebase();
            updateLanguage();
            
            // Set up real-time listener
            setupRealtimeListener();
            
            // Monitor connection status
            monitorConnectionStatus();
        });

        // Monitor Firebase connection status
        function monitorConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');
            const statusDot = statusElement.querySelector('span:first-child');
            const statusText = statusElement.querySelector('span:last-child');
            
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", function(snap) {
                const lang = translations[currentLanguage].connection;
                
                if (snap.val() === true) {
                    statusElement.className = statusElement.className.replace(/bg-\w+-\d+/, 'bg-green-100').replace(/text-\w+-\d+/, 'text-green-800');
                    statusDot.className = 'w-2 h-2 bg-green-500 rounded-full mr-1';
                    statusText.textContent = lang.connected;
                } else {
                    statusElement.className = statusElement.className.replace(/bg-\w+-\d+/, 'bg-red-100').replace(/text-\w+-\d+/, 'text-red-800');
                    statusDot.className = 'w-2 h-2 bg-red-500 rounded-full mr-1 pulse';
                    statusText.textContent = lang.disconnected;
                }
            });
        }

        // Set up real-time listener for file changes
        function setupRealtimeListener() {
            const filesRef = database.ref('files');
            
            filesRef.on('child_added', (snapshot) => {
                const file = snapshot.val();
                const syncStatus = document.getElementById('syncStatus');
                syncStatus.classList.remove('hidden');
                
                // Only add if it's not already in our list
                if (!uploadedFiles.some(f => f.id === file.id)) {
                    uploadedFiles.push(file);
                    renderFileList();
                }
                
                syncStatus.classList.add('hidden');
            });
            
            filesRef.on('child_removed', (snapshot) => {
                const fileId = snapshot.key;
                const syncStatus = document.getElementById('syncStatus');
                syncStatus.classList.remove('hidden');
                
                uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
                renderFileList();
                
                syncStatus.classList.add('hidden');
            });
        }

        // Fetch files from Firebase
        async function fetchFilesFromFirebase() {
            try {
                const snapshot = await database.ref('files').once('value');
                const files = snapshot.val();
                
                if (files) {
                    uploadedFiles = Object.values(files);
                    renderFileList();
                }
                
                if (uploadedFiles.length > 0) {
                    document.getElementById('emptyState').style.display = 'none';
                }
            } catch (error) {
                console.error('Error fetching files:', error);
            }
        }

        // Toggle between languages
        function toggleLanguage() {
            currentLanguage = currentLanguage === 'en' ? 'tr' : 'en';
            updateLanguage();
        }

        // Update all text elements with current language
        function updateLanguage() {
            const lang = translations[currentLanguage];
            document.querySelector('h1').textContent = lang.title;
            document.querySelector('header p').textContent = lang.subtitle;
            document.querySelector('#dropzone h3').textContent = lang.dragDrop;
            document.querySelector('#dropzone p').textContent = lang.or;
            document.querySelector('#dropzone label').innerHTML = `<i class="fas fa-folder-open mr-2"></i> ${lang.uploadFile}`;
            document.querySelector('.bg-white.rounded-xl h2').innerHTML = `<i class="fas fa-file-alt mr-2"></i> ${lang.yourFiles}`;
            document.querySelector('#emptyState p').textContent = lang.noFiles;
            document.querySelector('#languageToggle').innerHTML = `<i class="fas fa-language mr-1"></i> ${lang.changeLanguage}`;
            
            // Update sort options
            const sortSelect = document.getElementById('sortSelect');
            sortSelect.options[0].text = lang.sortOptions.newest;
            sortSelect.options[1].text = lang.sortOptions.oldest;
            sortSelect.options[2].text = lang.sortOptions.nameAsc;
            sortSelect.options[3].text = lang.sortOptions.nameDesc;
            sortSelect.options[4].text = lang.sortOptions.sizeAsc;
            sortSelect.options[5].text = lang.sortOptions.sizeDesc;
            
            // Update buttons in file list
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
            });
            
            document.querySelectorAll('.copy-btn').forEach(btn => {
                if (!btn.classList.contains('copied')) {
                    btn.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
                }
            });
            
            if (document.getElementById('progressContainer').style.display !== 'none') {
                document.querySelector('#progressContainer span:first-child').textContent = lang.uploading;
            }
        }

        // Handle drag over event
        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.add('active');
        }

        // Handle drag leave event
        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
        }

        // Handle drop event
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropzone').classList.remove('active');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        }

        // Handle file selection via input
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
            // Reset the input to allow selecting the same file again
            e.target.value = '';
        }

        // Upload files to Firebase Storage and save metadata to Realtime Database
        async function uploadFiles(files) {
            // Show progress bar
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            
            progressContainer.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';
            
            // Upload each file
            for (const file of files) {
                try {
                    // Create a unique filename with timestamp
                    const timestamp = Date.now();
                    const fileExtension = file.name.split('.').pop();
                    const uniqueFilename = `${timestamp}.${fileExtension}`;
                    
                    // Create storage reference
                    const storageRef = storage.ref().child(`files/${currentUserId}/${uniqueFilename}`);
                    
                    // Upload file to Firebase Storage
                    const uploadTask = storageRef.put(file);
                    
                    // Listen for upload progress
                    uploadTask.on('state_changed', 
                        (snapshot) => {
                            // Progress tracking
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            progressFill.style.width = `${progress}%`;
                            progressPercent.textContent = `${Math.round(progress)}%`;
                        },
                        (error) => {
                            console.error('Upload error:', error);
                            alert('Error uploading file. Please try again.');
                        },
                        async () => {
                            // Upload complete
                            const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                            
                            // Save file metadata to Realtime Database
                            const fileData = {
                                id: timestamp.toString(),
                                name: file.name,
                                size: file.size,
                                url: downloadURL,
                                uploadedAt: timestamp,
                                owner: currentUserId,
                                storagePath: uploadTask.snapshot.ref.fullPath
                            };
                            
                            await database.ref(`files/${fileData.id}`).set(fileData);
                            
                            // Hide progress bar when all files are uploaded
                            if (Array.from(files).indexOf(file) === files.length - 1) {
                                setTimeout(() => {
                                    progressContainer.classList.add('hidden');
                                }, 1000);
                            }
                        }
                    );
                    
                } catch (error) {
                    console.error('Error uploading file:', error);
                    alert('Error uploading file. Please try again.');
                }
            }
            
            // Hide empty state if it was shown
            document.getElementById('emptyState').style.display = 'none';
            
            // Sort files by newest first
            sortFiles('newest');
        }

        // Render the file list
        function renderFileList() {
            const fileList = document.getElementById('fileList');
            const lang = translations[currentLanguage];
            
            // Clear existing items (except empty state)
            const itemsToRemove = Array.from(fileList.children).filter(el => el.id !== 'emptyState');
            itemsToRemove.forEach(el => el.remove());
            
            // Add all files to the list
            uploadedFiles.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item bg-gray-50 rounded-lg p-4 flex items-center justify-between';
                fileItem.id = `file-${file.id}`;
                
                const fileInfo = document.createElement('div');
                fileInfo.className = 'flex items-center';
                
                const fileIcon = document.createElement('div');
                fileIcon.className = 'bg-blue-100 p-2 rounded-lg mr-3';
                
                const icon = document.createElement('i');
                icon.className = 'fas ' + getFileIcon(file.name) + ' text-blue-500';
                fileIcon.appendChild(icon);
                
                const fileName = document.createElement('div');
                fileName.className = 'flex flex-col';
                
                const name = document.createElement('span');
                name.className = 'font-medium text-gray-800';
                name.textContent = file.name;
                
                const details = document.createElement('div');
                details.className = 'flex space-x-3 text-xs text-gray-500';
                
                const size = document.createElement('span');
                size.textContent = formatFileSize(file.size);
                
                const date = document.createElement('span');
                date.textContent = formatDate(file.uploadedAt);
                
                // Add owner badge if it's not the current user's file
                if (file.owner !== currentUserId) {
                    const owner = document.createElement('span');
                    owner.className = 'bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded-full';
                    owner.textContent = 'Shared';
                    details.appendChild(owner);
                }
                
                details.appendChild(size);
                details.appendChild(date);
                
                fileName.appendChild(name);
                fileName.appendChild(details);
                
                fileInfo.appendChild(fileIcon);
                fileInfo.appendChild(fileName);
                
                const fileActions = document.createElement('div');
                fileActions.className = 'flex space-x-2';
                
                // Copy Link Button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-full text-sm transition duration-300';
                copyBtn.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
                copyBtn.onclick = () => copyFileLink(file, copyBtn);
                
                // Download Button
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-full text-sm transition duration-300';
                downloadBtn.innerHTML = `<i class="fas fa-download mr-1"></i> ${lang.download}`;
                downloadBtn.onclick = () => downloadFile(file);
                
                // Delete Button (only for current user's files)
                if (file.owner === currentUserId) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-full text-sm transition duration-300';
                    deleteBtn.innerHTML = `<i class="fas fa-trash mr-1"></i> ${lang.delete}`;
                    deleteBtn.onclick = () => deleteFile(file.id, fileItem, file.storagePath);
                    fileActions.appendChild(deleteBtn);
                }
                
                fileActions.appendChild(copyBtn);
                fileActions.appendChild(downloadBtn);
                
                fileItem.appendChild(fileInfo);
                fileItem.appendChild(fileActions);
                
                fileList.appendChild(fileItem);
            });
            
            // Show empty state if no files
            if (uploadedFiles.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
            } else {
                document.getElementById('emptyState').style.display = 'none';
            }
        }

        // Sort files based on selected option
        function sortFiles() {
            const sortSelect = document.getElementById('sortSelect');
            const sortBy = sortSelect ? sortSelect.value : 'newest';
            
            uploadedFiles.sort((a, b) => {
                switch(sortBy) {
                    case 'newest':
                        return b.uploadedAt - a.uploadedAt;
                    case 'oldest':
                        return a.uploadedAt - b.uploadedAt;
                    case 'name-asc':
                        return a.name.localeCompare(b.name);
                    case 'name-desc':
                        return b.name.localeCompare(a.name);
                    case 'size-asc':
                        return a.size - b.size;
                    case 'size-desc':
                        return b.size - a.size;
                    default:
                        return 0;
                }
            });
            
            renderFileList();
        }

        // Copy file link to clipboard
        function copyFileLink(file, button) {
            const lang = translations[currentLanguage];
            
            navigator.clipboard.writeText(file.url).then(() => {
                button.innerHTML = `<i class="fas fa-check mr-1"></i> ${lang.copied}`;
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.innerHTML = `<i class="fas fa-link mr-1"></i> ${lang.copyLink}`;
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        // Download a file
        function downloadFile(file) {
            const a = document.createElement('a');
            a.href = file.url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Delete a file from Firebase Storage and Realtime Database
        async function deleteFile(fileId, element, storagePath) {
            try {
                // Delete from Firebase Storage
                if (storagePath) {
                    const fileRef = storage.ref().child(storagePath);
                    await fileRef.delete();
                }
                
                // Delete from Realtime Database
                await database.ref(`files/${fileId}`).remove();
                
                // Remove from local list
                uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
                
                // Remove from UI
                element.remove();
                
                // Show empty state if no files left
                if (uploadedFiles.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (error) {
                console.error('Error deleting file:', error);
                alert('Error deleting file. Please try again.');
            }
        }

        // Helper function to get file icon based on extension
        function getFileIcon(filename) {
            const extension = filename.split('.').pop().toLowerCase();
            
            switch(extension) {
                case 'pdf':
                    return 'fa-file-pdf';
                case 'doc':
                case 'docx':
                    return 'fa-file-word';
                case 'xls':
                case 'xlsx':
                    return 'fa-file-excel';
                case 'ppt':
                case 'pptx':
                    return 'fa-file-powerpoint';
                case 'jpg':
                case 'jpeg':
                case 'png':
                case 'gif':
                case 'svg':
                case 'webp':
                    return 'fa-file-image';
                case 'zip':
                case 'rar':
                case '7z':
                case 'tar':
                case 'gz':
                    return 'fa-file-archive';
                case 'mp3':
                case 'wav':
                case 'ogg':
                case 'flac':
                    return 'fa-file-audio';
                case 'mp4':
                case 'avi':
                case 'mov':
                case 'mkv':
                case 'webm':
                    return 'fa-file-video';
                case 'txt':
                case 'rtf':
                case 'md':
                    return 'fa-file-alt';
                case 'html':
                case 'htm':
                case 'css':
                case 'js':
                case 'json':
                case 'php':
                case 'py':
                case 'java':
                case 'c':
                case 'cpp':
                case 'cs':
                    return 'fa-file-code';
                default:
                    return 'fa-file';
            }
        }

        // Helper function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Helper function to format date
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return date.toLocaleDateString(undefined, options);
        }
    </script>
